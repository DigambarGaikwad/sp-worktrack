<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SP WorkTrack - Admin Settings</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../shared/appShell.css" />
</head>
<body>
  <div class="sp-app-shell">
    <div class="sp-page">
      <div id="spAppHeader"></div>
      <main class="admin-page">
        <section class="section-card">
          <div class="section-title">Admin Settings</div>
          <div class="section-subtitle">Master data, access, backup, maintenance and controls.</div>
          <div id="adminModal" class="modal">
            <div class="modal-content admin-modal-content">
              <div id="adminLoginBox">
                <h2>Admin Login</h2>
                <input id="adminPinInput" class="admin-input" type="password" placeholder="Enter Admin PIN" />
                <button class="btn green" id="adminLoginBtn" type="button">Login</button>
              </div>
              <div id="adminPanel" class="hidden admin-panel">
                <div class="tabs">
                  <button class="tab active" data-tab="tabMachines" type="button">Machines</button>
                  <button class="tab" data-tab="tabEmployees" type="button">Employees</button>
                  <button class="tab" data-tab="tabShifts" type="button">Shifts</button>
                  <button class="tab" data-tab="tabWork" type="button">Work / Sub Work</button>
                  <button class="tab" data-tab="tabLossReasons" type="button">Loss Reasons</button>
                  <button class="tab" data-tab="tabRootAreas" type="button">Root Areas</button>
                  <button class="tab" data-tab="tabPin" type="button">Change PIN</button>
                </div>
                <div id="tabMachines" class="tab-page"><div class="section-title">Machines</div><div id="machinesList"></div><button class="btn green" id="addMachineBtn" type="button">+ Add Machine</button></div>
                <div id="tabEmployees" class="tab-page hidden"><div class="section-title">Employees</div><div id="employeesList"></div><button class="btn green" id="addEmployeeBtn" type="button">+ Add Employee</button></div>
                <div id="tabShifts" class="tab-page hidden"><div class="section-title">Shifts</div><div id="shiftsList"></div><button class="btn green" id="addShiftBtn" type="button">+ Add Shift</button></div>
                <div id="tabWork" class="tab-page hidden"><div class="section-title">Work / Sub Work</div><div id="workList"></div></div>
                <div id="tabLossReasons" class="tab-page hidden"><div class="section-title">Loss Reasons</div><div id="lossReasonsList"></div><button class="btn green" id="addLossReasonBtn" type="button">+ Add Loss Reason</button></div>
                <div id="tabRootAreas" class="tab-page hidden"><div class="section-title">Root Areas</div><div id="rootAreasList"></div><button class="btn green" id="addRootAreaBtn" type="button">+ Add Root Area</button></div>
                <div id="tabPin" class="tab-page hidden"><div class="section-title">Change PIN</div><input id="oldPinInput" class="admin-input" type="password" placeholder="Old PIN" /><input id="newPinInput" class="admin-input" type="password" placeholder="New PIN" /><input id="recoveryEmailInput" class="admin-input" type="email" placeholder="Recovery Email" /><button class="btn green" id="savePinBtn" type="button">Save PIN</button></div>
                <hr />
                <button class="btn green" id="adminSaveBtn" type="button">Save to DB</button>
                <button class="btn grey" id="adminLogoutBtn" type="button">Logout</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../config.js"></script><script src="../shared/appHeader.js"></script><script>window.SPWT.renderAppHeader({ title: "SP WorkTrack", subtitle: "Production Management System" });</script><script src="admin.js"></script><script src="../dbOnlyDataPatch.js"></script><script src="../app.js"></script><script src="../adminMainWorkPatch.js"></script><script src="../adminLossRootPatch.js"></script><script src="adminDb.js"></script><script src="../plannedAbsentEmployeeDbPatch.js"></script><script src="../adminEmployeeAvailableMinutesPatch.js"></script><script src="adminDbPatch.js"></script><script src="adminPinDb.js"></script><script src="adminButtonFix.js"></script><script src="adminAccessUi.js"></script><script src="adminPermissionUiPatch.js"></script><script src="../adminControlsPatch.js"></script><script src="../performanceScoreAdminPatch.js"></script><script src="../backupControlsPatch.js"></script><script src="../qualityReportRecipientsPatch.js"></script><script src="../qualityReportRecipientsSaveBridgePatch.js"></script><script src="../maintenanceAdminPatch.js"></script><script src="../maintenanceOtpGatePatch.js"></script><script src="../maintenanceActionVisibilityPatch.js"></script><script src="../maintenanceEmployeeDropdownPatch.js"></script><script src="../maintenanceSetupClearPatch.js"></script><script src="../maintenanceMasterRecordDeletePatch.js"></script><script src="../maintenanceRestoreBackupUiPatch.js"></script>
  <script src="../maintenanceEmptyDbPatch.js"></script>
  <script src="../maintenanceBackupDeletePatch.js"></script>
</body>
</html>
